# ==============================
# LIVE TESTING
# ==============================

# Automatically load local .env file if present (ignored in production)
spring.config.import=optional:file:.env[.properties]

# Neon Cloud Database Connection (Secured via Environment Variables)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate settings for production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Dynamic Server Port for Cloud Hosting
server.port=${PORT:8080}

