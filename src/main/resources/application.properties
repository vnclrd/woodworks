# Automatically load local .env file if present (ignored in production)
spring.config.import=optional:file:.env[.properties]

# ==============================
# SERVER CONFIGURATION
# ==============================
server.port=${PORT:8080}

# ==============================
# DATABASE CONFIGURATION (Neon)
# ==============================
spring.datasource.driver-class-name=org.postgresql.Driver

# Comment for local testing (Uncomment when deploying backend to GCP)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/woodworksdb}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}

# Local Database (Uncomment for local testing)
#spring.datasource.url=jdbc:postgresql://localhost:5432/woodworksdb
#spring.datasource.username=postgres
#spring.datasource.password=password

# ==============================
# JPA / HIBERNATE SETTINGS
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# SECRET KEY FOR AES ENCRYPTION
# ==============================
app.security.encryption-key=${ENCRYPTION_KEY}

# ==============================
# SMTP
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_ADDRESS}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true