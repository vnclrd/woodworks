# Automatically load local .env file if present (ignored in production)
spring.config.import=optional:file:.env[.properties]

# ==============================
# SERVER CONFIGURATION
# ==============================
server.port=${PORT:8080}

# ==============================
# DATABASE CONFIGURATION (Neon / Local Fallback)
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/woodworksdb}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / HIBERNATE SETTINGS
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# SECRET KEY FOR AES ENCRYPTION
# ==============================
app.security.encryption-key=${ENCRYPTION_KEY}